<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AWS Community Board — Event chatroom</title>
    <meta
      name="description"
      content="Token-gated conference chatroom. Share text and photos in the browser — no app install required."
    />
    <meta
      name="keywords"
      content="AWS Community Board, AWS User Group, conference chatroom, speaker chat, event chat, AWS Community Day Manila, AWS Builder Center"
    />
    <meta name="author" content="AWS User Group" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#5D26FF" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://aws-user-group.com/community-board/chat.html" />

    <!-- Open Graph — WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AWS Community Board" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://aws-user-group.com/community-board/chat.html" />
    <meta
      property="og:title"
      content="AWS Community Board — Event chatroom"
    />
    <meta
      property="og:description"
      content="Token-gated conference chatroom. Share notes and photos with speakers and participants — no app install."
    />
    <meta
      property="og:image"
      content="https://aws-user-group.com/demo/seo_banner.jpg"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2848" />
    <meta property="og:image:height" content="1504" />
    <meta
      property="og:image:alt"
      content="AWS Community Board event chatroom for AWS builders"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AWS Community Board — Event chatroom"
    />
    <meta
      name="twitter:description"
      content="Token-gated conference chatroom. Share notes and photos with speakers and participants — no app install."
    />
    <meta
      name="twitter:image"
      content="https://aws-user-group.com/demo/seo_banner.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="AWS Community Board event chatroom for AWS builders"
    />
    <style>
      :root {
        --pink: #ff5bff;
        --cyan: #6ce1ff;
        --indigo: #5d26ff;
        --lavender: #e2dbff;
        --black: #111111;
        --charcoal: #2a2a2a;
        --ink: #0a0a0a;
        --mute: #6b6b6b;
        --line: #d8d8d8;
        --paper: #fafafa;
        --white: #ffffff;
        --grad: linear-gradient(135deg, var(--cyan) 0%, var(--indigo) 48%, var(--pink) 100%);
        --font-display: Impact, "Arial Black", "Helvetica Neue", sans-serif;
        --font-sans: "Segoe UI", system-ui, sans-serif;
        --font-mono: ui-monospace, "Cascadia Code", Consolas, monospace;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        color: var(--ink);
        background:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px),
          var(--paper);
        background-size: 48px 48px, 48px 48px, auto;
        font-family: var(--font-mono);
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100dvh;
        max-width: 820px;
        margin: 0 auto;
        border-left: 2px solid transparent;
        border-right: 2px solid transparent;
      }

      @media (min-width: 840px) {
        .app {
          border-color: var(--black);
          box-shadow: 8px 0 0 rgba(93, 38, 255, 0.18);
        }
      }

      .top {
        padding: calc(var(--safe-top) + 0.7rem) 0.85rem 0.85rem;
        border-bottom: 2px solid var(--black);
        background: var(--white);
      }

      .top::before {
        content: "";
        display: block;
        height: 5px;
        margin: -0.7rem -0.85rem 0.75rem;
        background: var(--grad);
      }

      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .back,
      .refresh {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.2rem;
        padding: 0.3rem 0.6rem;
        border: 2px solid var(--black);
        background: var(--white);
        color: inherit;
        text-decoration: none;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .refresh {
        background: var(--black);
        color: var(--white);
      }

      .refresh:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .back:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--cyan);
        outline-offset: 2px;
      }

      .sync {
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mute);
        text-align: right;
      }

      h1 {
        margin: 0.7rem 0 0.65rem;
        font-family: var(--font-sans);
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 1.35;
        text-transform: none;
      }

      .name-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.5rem;
        align-items: center;
      }

      .name-row label {
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mute);
      }

      input,
      textarea,
      button {
        font-family: inherit;
      }

      input[type="text"],
      input[type="password"],
      textarea {
        width: 100%;
        border: 2px solid var(--black);
        background: var(--paper);
        color: var(--ink);
        padding: 0.55rem 0.65rem;
        font-size: 16px;
      }

      .feed {
        overflow: auto;
        padding: 0.85rem 0.85rem 1rem;
        -webkit-overflow-scrolling: touch;
      }

      .empty {
        margin: 1.5rem 0;
        padding: 1rem;
        border: 2px dashed var(--line);
        background: var(--white);
        color: var(--mute);
        font-size: 0.85rem;
      }

      .msg {
        margin: 0 0 0.75rem;
        padding: 0.75rem 0.8rem 0.8rem;
        border: 2px solid var(--black);
        background: var(--white);
        box-shadow: 4px 4px 0 rgba(108, 225, 255, 0.45);
      }

      .msg.is-mine {
        box-shadow: 4px 4px 0 rgba(255, 91, 255, 0.4);
      }

      .msg-head {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.4rem;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .msg-name {
        color: var(--indigo);
        font-weight: 700;
      }

      .msg-time {
        color: var(--mute);
      }

      .msg-text {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--font-sans);
        font-size: 0.95rem;
      }

      .msg img {
        display: block;
        width: 100%;
        max-width: 420px;
        margin-top: 0.55rem;
        border: 2px solid var(--black);
        background: var(--lavender);
        cursor: zoom-in;
      }

      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(17, 17, 17, 0.92);
        flex-direction: column;
      }

      .lightbox.is-on {
        display: flex;
      }

      .lightbox-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        padding: calc(var(--safe-top) + 0.7rem) 0.85rem 0.7rem;
      }

      .lightbox-bar button {
        min-height: 2.4rem;
        padding: 0.3rem 0.7rem;
        border: 2px solid var(--white);
        background: var(--black);
        color: var(--white);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .lightbox-stage {
        flex: 1;
        overflow: hidden;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem;
      }

      .lightbox-stage img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        transform-origin: center center;
        user-select: none;
        -webkit-user-drag: none;
      }

      .lightbox-tools {
        display: flex;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.7rem 0.85rem calc(var(--safe-bottom) + 0.85rem);
      }

      .lightbox-tools button {
        min-width: 2.8rem;
        min-height: 2.8rem;
        border: 2px solid var(--white);
        background: var(--black);
        color: var(--white);
        font-family: var(--font-mono);
        font-size: 1.1rem;
        cursor: pointer;
      }

      .composer {
        padding: 0.75rem 0.85rem calc(var(--safe-bottom) + 0.85rem);
        border-top: 2px solid var(--black);
        background: var(--white);
      }

      .preview {
        display: none;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.55rem;
      }

      .preview.is-on {
        display: flex;
      }

      .preview img {
        width: 56px;
        height: 56px;
        object-fit: cover;
        border: 2px solid var(--black);
      }

      .preview button {
        min-height: 2rem;
        padding: 0.25rem 0.55rem;
        border: 2px solid var(--black);
        background: var(--lavender);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .composer-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.45rem;
        align-items: end;
      }

      textarea {
        min-height: 2.8rem;
        max-height: 7.5rem;
        resize: none;
      }

      .icon-btn,
      .send {
        min-width: 2.8rem;
        min-height: 2.8rem;
        border: 2px solid var(--black);
        cursor: pointer;
      }

      .icon-btn {
        background: var(--white);
        font-size: 1.1rem;
      }

      .send {
        background: var(--black);
        color: var(--white);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0 0.7rem;
      }

      .send:disabled,
      .icon-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .hint {
        margin: 0.45rem 0 0;
        color: var(--mute);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .file {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="top-row">
          <a class="back" href="./index.html">← Events</a>
          <div class="top-actions">
            <span id="sync" class="sync">Locked</span>
            <button id="refresh" class="refresh" type="button" disabled>Refresh</button>
          </div>
        </div>
        <h1 id="title">Chatroom</h1>
        <div class="name-row">
          <label for="name">Name</label>
          <input id="name" type="text" maxlength="40" placeholder="Your display name" autocomplete="nickname" />
        </div>
      </header>

      <section id="feed" class="feed" aria-live="polite"></section>

      <form id="composer" class="composer">
        <div id="preview" class="preview">
          <img id="previewImg" alt="Selected image preview" />
          <button id="clearImage" type="button">Remove image</button>
        </div>
        <div class="composer-row">
          <textarea id="text" rows="2" maxlength="2000" placeholder="Share note with room"></textarea>
          <button id="photo" class="icon-btn" type="button" title="Upload image" aria-label="Upload image">▣</button>
          <button id="send" class="send" type="submit">Send</button>
        </div>
        <input id="file" class="file" type="file" accept="image/*" />
        <p id="hint" class="hint">Enter to send · Shift+Enter for a new line</p>
      </form>
    </div>

    <div id="lightbox" class="lightbox">
      <div class="lightbox-bar">
        <span class="sync" id="zoomLabel">1.0×</span>
        <button id="lightboxClose" type="button">Close</button>
      </div>
      <div id="lightboxStage" class="lightbox-stage">
        <img id="lightboxImg" alt="Large photo" />
      </div>
      <div class="lightbox-tools">
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="zoomReset" type="button" aria-label="Reset zoom">1×</button>
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      </div>
    </div>

    <script>
      (function () {
        const LAMBDA_URL = "https://qhwccxpuycdxk3lyyvhew4bkym0dqjxc.lambda-url.us-east-1.on.aws/";
        const POLL_MS = 60000;
        const MAX_IMAGE_EDGE = 2000;
        const JPEG_QUALITY = 0.9;
        const params = new URLSearchParams(window.location.search);
        const eventId = String(params.get("id") || "").trim();
        const accessToken = String(params.get("token") || "").trim();

        const titleEl = document.getElementById("title");
        const syncEl = document.getElementById("sync");
        const feedEl = document.getElementById("feed");
        const nameInput = document.getElementById("name");
        const textInput = document.getElementById("text");
        const fileInput = document.getElementById("file");
        const preview = document.getElementById("preview");
        const previewImg = document.getElementById("previewImg");
        const hint = document.getElementById("hint");
        const sendBtn = document.getElementById("send");
        const refreshBtn = document.getElementById("refresh");
        const lightbox = document.getElementById("lightbox");
        const lightboxStage = document.getElementById("lightboxStage");
        const lightboxImg = document.getElementById("lightboxImg");
        const zoomLabel = document.getElementById("zoomLabel");

        let imageData = "";
        let pollTimer = 0;
        let lastHash = "";
        let viewScale = 1;
        let viewX = 0;
        let viewY = 0;
        let dragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let pinchStart = 0;
        let pinchScale = 1;

        nameInput.value = window.localStorage.getItem("community-board-name") || "";

        function setHint(text, isError) {
          hint.textContent = text;
          hint.style.color = isError ? "var(--indigo)" : "var(--mute)";
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function imageSrc(message) {
          const imageName = message && message.imageName ? String(message.imageName) : "";
          if (/^event_\d+_[0-9a-f-]+\.(jpe?g|png|gif|webp)$/i.test(imageName)) {
            return "https://aws-user-group.com/community-board/img/" + imageName;
          }
          const src = message && message.image ? String(message.image) : "";
          if (/^https:\/\/aws-user-group\.com\/community-board\/img\/event_\d+_[0-9a-f-]+\.(jpe?g|png|gif|webp)$/i.test(src)) {
            return src;
          }
          return "";
        }

        function formatTime(iso) {
          const date = new Date(iso);
          if (Number.isNaN(date.getTime())) {
            return "";
          }
          return date.toLocaleString([], {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        function scrollToLatest() {
          feedEl.scrollTop = feedEl.scrollHeight;
        }

        function applyView() {
          viewScale = Math.min(6, Math.max(1, viewScale));
          if (viewScale === 1) {
            viewX = 0;
            viewY = 0;
          }
          lightboxImg.style.transform =
            "translate(" + viewX + "px, " + viewY + "px) scale(" + viewScale + ")";
          zoomLabel.textContent = viewScale.toFixed(1) + "×";
        }

        function openLightbox(src, alt) {
          lightboxImg.src = src;
          lightboxImg.alt = alt || "Large photo";
          viewScale = 1;
          viewX = 0;
          viewY = 0;
          applyView();
          lightbox.classList.add("is-on");
        }

        function closeLightbox() {
          lightbox.classList.remove("is-on");
          lightboxImg.removeAttribute("src");
          viewScale = 1;
          viewX = 0;
          viewY = 0;
        }

        feedEl.addEventListener("click", function (event) {
          const photo = event.target.closest("img.msg-photo");
          if (!photo) {
            return;
          }
          openLightbox(photo.src, photo.alt);
        });

        document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
        document.getElementById("zoomIn").addEventListener("click", function () {
          viewScale += 0.25;
          applyView();
        });
        document.getElementById("zoomOut").addEventListener("click", function () {
          viewScale -= 0.25;
          applyView();
        });
        document.getElementById("zoomReset").addEventListener("click", function () {
          viewScale = 1;
          applyView();
        });

        lightbox.addEventListener("click", function (event) {
          if (event.target === lightbox || event.target === lightboxStage) {
            closeLightbox();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape" && lightbox.classList.contains("is-on")) {
            closeLightbox();
          }
        });

        lightboxStage.addEventListener(
          "wheel",
          function (event) {
            if (!lightbox.classList.contains("is-on")) {
              return;
            }
            event.preventDefault();
            viewScale += event.deltaY < 0 ? 0.15 : -0.15;
            applyView();
          },
          { passive: false }
        );

        lightboxStage.addEventListener("pointerdown", function (event) {
          if (viewScale <= 1) {
            return;
          }
          dragging = true;
          dragStartX = event.clientX - viewX;
          dragStartY = event.clientY - viewY;
          lightboxStage.setPointerCapture(event.pointerId);
        });

        lightboxStage.addEventListener("pointermove", function (event) {
          if (!dragging) {
            return;
          }
          viewX = event.clientX - dragStartX;
          viewY = event.clientY - dragStartY;
          applyView();
        });

        lightboxStage.addEventListener("pointerup", function () {
          dragging = false;
        });

        lightboxStage.addEventListener(
          "touchstart",
          function (event) {
            if (event.touches.length === 2) {
              dragging = false;
              const a = event.touches[0];
              const b = event.touches[1];
              pinchStart = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
              pinchScale = viewScale;
            }
          },
          { passive: true }
        );

        lightboxStage.addEventListener(
          "touchmove",
          function (event) {
            if (event.touches.length !== 2) {
              return;
            }
            event.preventDefault();
            const a = event.touches[0];
            const b = event.touches[1];
            const distance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            if (!pinchStart) {
              return;
            }
            viewScale = pinchScale * (distance / pinchStart);
            applyView();
          },
          { passive: false }
        );

        function renderMessages(board, stickToBottom) {
          const messages = Array.isArray(board.messages) ? board.messages : [];
          const myName = nameInput.value.trim();
          titleEl.textContent = board.title || "Event " + eventId;

          if (messages.length === 0) {
            feedEl.innerHTML = '<p class="empty">No posts yet. Be the first signal in this room.</p>';
            return;
          }

          feedEl.innerHTML = messages
            .map(function (message) {
              const mine = myName && message.name === myName ? " is-mine" : "";
              const text = message.text ? '<p class="msg-text">' + escapeHtml(message.text) + "</p>" : "";
              const src = imageSrc(message);
              const image = src
                ? '<img class="msg-photo" src="' +
                  src +
                  '" alt="' +
                  escapeHtml(message.imageName || "shared image") +
                  '">'
                : "";
              return (
                '<article class="msg' +
                mine +
                '">' +
                '<div class="msg-head">' +
                '<span class="msg-name">' +
                escapeHtml(message.name || "Guest") +
                "</span>" +
                '<span class="msg-time">' +
                escapeHtml(formatTime(message.createdAt)) +
                "</span>" +
                "</div>" +
                text +
                image +
                "</article>"
              );
            })
            .join("");

          const nearBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 140;
          if (stickToBottom || nearBottom || lastHash === "") {
            scrollToLatest();
            const images = feedEl.querySelectorAll("img");
            Array.prototype.forEach.call(images, function (img) {
              if (img.complete) {
                scrollToLatest();
                return;
              }
              img.addEventListener("load", scrollToLatest);
              img.addEventListener("error", scrollToLatest);
            });
          }
        }

        function loadBoard(force) {
          const url = new URL(LAMBDA_URL);
          url.searchParams.set("eventId", eventId);
          url.searchParams.set("token", accessToken);
          url.searchParams.set("t", String(Date.now()));

          return fetch(url.toString(), { method: "GET" }).then(function (response) {
            return response.json().then(function (body) {
              if (!response.ok || !body.ok) {
                throw new Error(body.error || "Could not load room");
              }
              return {
                eventId: body.eventId || eventId,
                title: body.title || "Event " + eventId,
                updatedAt: body.updatedAt || "",
                messages: Array.isArray(body.messages) ? body.messages : [],
              };
            });
          }).then(function (board) {
            const hash = JSON.stringify(board && board.updatedAt) + String((board.messages || []).length);
            if (force || hash !== lastHash) {
              renderMessages(board, force);
              lastHash = hash;
            }
            syncEl.textContent = "Synced " + formatTime(new Date().toISOString());
            return board;
          });
        }

        function refreshBoard() {
          if (!accessToken) {
            setHint("Enter the access token on the events page.", true);
            return;
          }
          refreshBtn.disabled = true;
          syncEl.textContent = "Refreshing…";
          lastHash = "";
          loadBoard(true)
            .then(function () {
              setHint("Room updated");
            })
            .catch(function () {
              syncEl.textContent = "Refresh failed";
              setHint("Could not load room JSON.", true);
            })
            .then(function () {
              refreshBtn.disabled = false;
            });
        }

        function clearImage() {
          imageData = "";
          fileInput.value = "";
          preview.classList.remove("is-on");
          previewImg.removeAttribute("src");
        }

        function compressImage(file) {
          return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onerror = function () {
              reject(new Error("Could not read image"));
            };
            reader.onload = function () {
              const img = new Image();
              img.onerror = function () {
                reject(new Error("Could not decode image"));
              };
              img.onload = function () {
                const scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(img.width, img.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.max(1, Math.round(img.width * scale));
                canvas.height = Math.max(1, Math.round(img.height * scale));
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
              };
              img.src = String(reader.result);
            };
            reader.readAsDataURL(file);
          });
        }

        function startPolling() {
          if (pollTimer) {
            window.clearInterval(pollTimer);
          }
          loadBoard().catch(function () {
            setHint("Could not load room JSON.", true);
          });
          pollTimer = window.setInterval(function () {
            loadBoard().catch(function () {
              syncEl.textContent = "Sync failed";
            });
          }, POLL_MS);
        }

        refreshBtn.addEventListener("click", refreshBoard);

        nameInput.addEventListener("input", function () {
          window.localStorage.setItem("community-board-name", nameInput.value.trim());
        });

        document.getElementById("photo").addEventListener("click", function () {
          fileInput.click();
        });

        document.getElementById("clearImage").addEventListener("click", clearImage);

        fileInput.addEventListener("change", function () {
          const file = fileInput.files && fileInput.files[0];
          if (!file) {
            return;
          }
          compressImage(file)
            .then(function (dataUrl) {
              imageData = dataUrl;
              previewImg.src = dataUrl;
              preview.classList.add("is-on");
              setHint("Image ready · send with or without text");
            })
            .catch(function () {
              clearImage();
              setHint("Could not process that image.", true);
            });
        });

        textInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            document.getElementById("composer").requestSubmit();
          }
        });

        document.getElementById("composer").addEventListener("submit", function (event) {
          event.preventDefault();
          if (!accessToken) {
            setHint("Enter the access token on the events page.", true);
            return;
          }

          const name = nameInput.value.trim();
          const text = textInput.value.trim();
          if (!name) {
            nameInput.focus();
            setHint("Add your name before sending.", true);
            return;
          }
          if (!text && !imageData) {
            setHint("Write a note or attach an image.", true);
            return;
          }

          sendBtn.disabled = true;
          setHint("Sending…");

          fetch(LAMBDA_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              token: accessToken,
              eventId: eventId,
              name: name,
              text: text,
              image: imageData || null,
            }),
          })
            .then(function (response) {
              return response.json().then(function (body) {
                if (!response.ok || !body.ok) {
                  throw new Error(body.error || "Send failed");
                }
                return body;
              });
            })
            .then(function () {
              textInput.value = "";
              clearImage();
              setHint("Posted · room refreshes every 60 seconds");
              lastHash = "";
              return loadBoard();
            })
            .catch(function (error) {
              setHint(error.message || "Send failed.", true);
            })
            .then(function () {
              sendBtn.disabled = false;
            });
        });

        if (!eventId) {
          titleEl.textContent = "Missing event";
          feedEl.innerHTML =
            '<p class="empty">No event id in the URL. Go back and choose an event.</p>';
          sendBtn.disabled = true;
          return;
        }

        if (!accessToken) {
          titleEl.textContent = "Event " + eventId;
          feedEl.innerHTML =
            '<p class="empty">Access token is missing. Go back to Events, enter the token, then join this room.</p>';
          sendBtn.disabled = true;
          return;
        }

        titleEl.textContent = "Event " + eventId;
        refreshBtn.disabled = false;
        startPolling();
      })();
    </script>
  </body>
</html>
